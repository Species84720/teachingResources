<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Label Torch Tool</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      overflow: hidden;
      background: #111;
      color: #fff;
    }
    #controls {
      padding: 10px;
      background: #222;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    #labelSidebar {
      width: 20%;
      background: #333;
      overflow-y: auto;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    #labelSidebar.show {
      display: flex;
    }
    .label {
      background: #eee;
      color: #000;
      padding: 4px 8px;
      border-radius: 5px;
      font-weight: bold;
      border: 1px solid #000;
      cursor: grab;
    }
    .label.placed {
      position: absolute;
      z-index: 5;
      pointer-events: auto;
    }
    #canvasContainer {
      position: relative;
      width: 100%;
      height: calc(100vh - 50px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      z-index: 1;
    }
    #torch {
      position: absolute;
      z-index: 3;
      width: 64px;
      height: 64px;
      pointer-events: none;
      transition: transform 0.05s linear;
    }
    .dropzone {
      position: absolute;
      border: 2px dashed #888;
      border-radius: 8px;
      width: 100px;
      height: 40px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="modeToggle">Switch to View Mode</button>

    <div id="editControls">
      <button id="uploadImage">Upload Image</button>
      <input type="file" id="imageInput" accept="image/*" hidden>

      <button id="uploadLabels">Upload Labels</button>
      <input type="file" id="labelInput" accept=".json" hidden>

      <button id="toggleReveal">Reveal Full Image</button>
      <button id="saveTemplate">Save Template</button>
    </div>

    <div id="viewControls" style="display:none;">
      <button id="loadTemplate">Load Template</button>
      <input type="file" id="loadTemplateInput" accept=".json" hidden>
    </div>
  </div>

  <div style="display: flex; width: 100%;">
    <div id="labelSidebar"></div>
    <div id="canvasContainer">
      <canvas id="canvas"></canvas>
      <img id="torch" src="torch.png" />
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const torch = document.getElementById("torch");
    const canvasContainer = document.getElementById("canvasContainer");
    const labelSidebar = document.getElementById("labelSidebar");

    const uploadImageBtn = document.getElementById("uploadImage");
    const imageInput = document.getElementById("imageInput");
    const uploadLabelsBtn = document.getElementById("uploadLabels");
    const labelInput = document.getElementById("labelInput");
    const toggleRevealBtn = document.getElementById("toggleReveal");

    const saveTemplateBtn = document.getElementById("saveTemplate");
    const loadTemplateBtn = document.getElementById("loadTemplate");
    const loadTemplateInput = document.getElementById("loadTemplateInput");

    const modeToggleBtn = document.getElementById("modeToggle");
    const editControls = document.getElementById("editControls");
    const viewControls = document.getElementById("viewControls");

    let img = new Image();
    let imgLoaded = false;
    let showAll = false;
    let editMode = true;
    let dragging = false;
    let circle = { x: 0, y: 0, radius: 100 };
    let currentTemplate = null;

    function resizeCanvas() {
      canvas.width = canvasContainer.clientWidth;
      canvas.height = canvasContainer.clientHeight;
    }

    function draw() {
      if (!imgLoaded) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const imgX = (canvas.width - img.width) / 2;
      const imgY = (canvas.height - img.height) / 2;

      if (showAll) {
        ctx.drawImage(img, imgX, imgY);
      } else {
        ctx.save();
        ctx.beginPath();
        ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, imgX, imgY);
        ctx.restore();

        ctx.fillStyle = "rgba(0,0,0,0.95)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.beginPath();
        ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2);
        ctx.clip();
        ctx.clearRect(circle.x - circle.radius, circle.y - circle.radius, circle.radius * 2, circle.radius * 2);
        ctx.drawImage(img, imgX, imgY);
        ctx.restore();
      }
    }

    function scaleImage() {
      const maxHeight = canvas.height * 0.9;
      if (img.height > maxHeight) {
        const scale = maxHeight / img.height;
        img.width *= scale;
        img.height = maxHeight;
      }
    }

    uploadImageBtn.addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        img.onload = () => {
          imgLoaded = true;
          scaleImage();
          resizeCanvas();
          draw();
          toggleRevealBtn.disabled = false;
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    uploadLabelsBtn.addEventListener("click", () => labelInput.click());
    labelInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const labels = JSON.parse(reader.result);
        labelSidebar.classList.add("show");
        canvasContainer.style.width = "80%";
        labelSidebar.innerHTML = "";
        labels.forEach(label => addLabelToSidebar(label));
      };
      reader.readAsText(file);
    });

    function addLabelToSidebar(text) {
      const div = document.createElement("div");
      div.className = "label";
      div.textContent = text;
      div.setAttribute("draggable", "true");
      div.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", text);
      });
      labelSidebar.appendChild(div);
    }

    function removeLabelFromSidebar(text) {
      const labels = labelSidebar.querySelectorAll(".label");
      labels.forEach(label => {
        if (label.textContent === text) label.remove();
      });
    }

    canvas.addEventListener("mousedown", (e) => {
      if (e.target.classList.contains("label")) return;
      dragging = true;
      moveCircle(e);
    });

    canvas.addEventListener("mousemove", (e) => {
      if (dragging) moveCircle(e);
      torch.style.left = `${e.clientX - 50}px`;
      torch.style.top = `${e.clientY - 20}px`;
    });

    canvas.addEventListener("mouseup", () => dragging = false);

    function moveCircle(e) {
      const rect = canvas.getBoundingClientRect();
      circle.x = e.clientX - rect.left;
      circle.y = e.clientY - rect.top;
      draw();
    }

    toggleRevealBtn.addEventListener("click", () => {
      showAll = !showAll;
      toggleRevealBtn.textContent = showAll ? "Hide Again" : "Reveal Full Image";

      const labels = document.querySelectorAll(".label.placed");
      labels.forEach(label => label.style.display = showAll ? "block" : "none");

      if (showAll) {
        labelSidebar.classList.add("show");
        canvasContainer.style.width = "80%";
      } else {
        labelSidebar.classList.remove("show");
        canvasContainer.style.width = "100%";
      }

      resizeCanvas();
      draw();
    });

    canvas.addEventListener("drop", (e) => {
      e.preventDefault();
      const label = e.dataTransfer.getData("text/plain");

      const x = e.clientX - canvas.getBoundingClientRect().left;
      const y = e.clientY - canvas.getBoundingClientRect().top;

      const div = document.createElement("div");
      div.className = "label placed";
      div.textContent = label;
      div.style.left = `${x}px`;
      div.style.top = `${y}px`;

      div.addEventListener("click", () => {
        div.remove();
        addLabelToSidebar(label);
      });

      if (!showAll) div.style.display = "none";

      canvasContainer.appendChild(div);
      removeLabelFromSidebar(label);
    });

    canvas.addEventListener("dragover", (e) => e.preventDefault());

    saveTemplateBtn.addEventListener("click", () => {
      if (!imgLoaded) return;

      const labels = Array.from(document.querySelectorAll(".label.placed")).map(label => ({
        text: label.textContent,
        x: parseFloat(label.style.left),
        y: parseFloat(label.style.top)
      }));

      const offCanvas = document.createElement("canvas");
      offCanvas.width = img.width;
      offCanvas.height = img.height;
      const offCtx = offCanvas.getContext("2d");
      offCtx.drawImage(img, 0, 0);
      const imageData = offCanvas.toDataURL("image/png");

      const template = { image: imageData, labels };
      const blob = new Blob([JSON.stringify(template)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "template.json";
      a.click();
    });

    loadTemplateBtn.addEventListener("click", () => loadTemplateInput.click());
    loadTemplateInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const template = JSON.parse(event.target.result);
        currentTemplate = template;

        img.onload = () => {
          imgLoaded = true;
          showAll = true;
          toggleRevealBtn.disabled = false;
          toggleRevealBtn.textContent = "Hide Again";

          labelSidebar.classList.add("show");
          canvasContainer.style.width = "80%";

          resizeCanvas();
          scaleImage();
          draw();
          resetCanvasAndLabels();
        };

        img.src = template.image;
      };
      reader.readAsText(file);
    });

    function resetCanvasAndLabels() {
      document.querySelectorAll(".label.placed").forEach(el => el.remove());
      document.querySelectorAll(".dropzone").forEach(z => z.remove());

      if (!editMode && imgLoaded && currentTemplate?.labels) {
        currentTemplate.labels.forEach(labelData => {
          const dropZone = document.createElement("div");
          dropZone.className = "dropzone";
          dropZone.dataset.correctLabel = labelData.text;
          dropZone.style.left = `${labelData.x}px`;
          dropZone.style.top = `${labelData.y}px`;

          dropZone.addEventListener("dragover", e => e.preventDefault());
          dropZone.addEventListener("drop", e => {
            e.preventDefault();
            const labelText = e.dataTransfer.getData("text/plain");
            if (labelText === dropZone.dataset.correctLabel) {
              dropZone.innerHTML = "";
              const label = document.createElement("div");
              label.className = "label placed";
              label.textContent = labelText;
              dropZone.appendChild(label);
              removeLabelFromSidebar(labelText);
            } else {
              dropZone.style.animation = "shake 0.3s";
              setTimeout(() => dropZone.style.animation = "", 300);
            }
          });

          canvasContainer.appendChild(dropZone);
        });
      }
    }

    modeToggleBtn.addEventListener("click", () => {
      editMode = !editMode;
      modeToggleBtn.textContent = editMode ? "Switch to View Mode" : "Switch to Edit Mode";
      editControls.style.display = editMode ? "block" : "none";
      viewControls.style.display = editMode ? "none" : "block";
      resetCanvasAndLabels();
    });

    window.addEventListener("resize", () => {
      resizeCanvas();
      draw();
    });

    resizeCanvas();
  </script>
</body>
</html>
