<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Board Game — TeacherKit</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--ink:#1c1c2e;--cream:#faf8f3;--warm:#f2ede4;--gold:#e9a825;--gold-dk:#c8891a;--rose:#c8584a;--sky:#3d7eb5;--sage:#4a7c6f;--lav:#7563b8;--surface:#fff;--border:rgba(28,28,46,.10);--ff:'Fraunces',serif;--fb:'DM Sans',sans-serif;}
    body{font-family:var(--fb);background:var(--cream);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
    .nav{height:50px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0;box-shadow:0 2px 6px rgba(28,28,46,.06);z-index:100;}
    .logo{font-family:var(--ff);font-weight:900;font-size:1.1rem;text-decoration:none;color:var(--ink);}.logo span{color:var(--gold);}
    .nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:100px;border:1.5px solid var(--border);font-family:var(--fb);font-weight:600;font-size:.78rem;cursor:pointer;transition:all .17s;background:transparent;color:var(--ink);}
    .btn:hover{border-color:var(--ink);background:var(--warm);}
    .btn-gold{background:var(--gold);color:var(--ink);border-color:var(--gold);}.btn-gold:hover{background:var(--gold-dk);}
    .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
    .btn-danger{background:var(--rose);color:#fff;border-color:var(--rose);}
    .btn-sage{background:var(--sage);color:#fff;border-color:var(--sage);}
    .btn-sm{padding:4px 10px;font-size:.72rem;}.btn:disabled{opacity:.4;pointer-events:none;}
    .avatar{width:28px;height:28px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7rem;overflow:hidden;}
    .avatar img{width:100%;height:100%;object-fit:cover;}

    .game-layout{flex:1;display:grid;grid-template-columns:200px 1fr 248px;overflow:hidden;}
    .controls-panel{background:var(--surface);border-right:1px solid var(--border);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;}
    .sec{background:var(--cream);border-radius:10px;padding:11px;border:1px solid var(--border);}
    .sec h4{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#aaa;margin-bottom:8px;}
    .player-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);}
    .player-row:last-child{border-bottom:none;}
    .player-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;color:#fff;flex-shrink:0;}
    .player-name{flex:1;font-size:.8rem;font-weight:600;}
    .player-pos{font-size:.7rem;color:#999;}
    .player-turn{outline:3px solid var(--gold);outline-offset:2px;}
    .dice-face{width:60px;height:60px;border-radius:10px;background:var(--surface);border:2px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;justify-items:center;padding:7px;box-shadow:0 4px 12px rgba(28,28,46,.1);transition:transform .15s;}
    .dice-face.rolling{animation:diceRoll .5s ease;}
    @keyframes diceRoll{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg) scale(1.1)}75%{transform:rotate(15deg) scale(1.1)}}
    .dice-pip{width:7px;height:7px;border-radius:50%;background:var(--ink);}.dice-pip.empty{background:transparent;}
    .fi{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
    .fi label{font-size:.73rem;font-weight:600;color:#666;min-width:54px;}
    .fi-inp{flex:1;padding:4px 8px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--fb);font-size:.77rem;background:var(--surface);color:var(--ink);outline:none;}
    .fi-inp:focus{border-color:var(--gold);}
    .saved-mini{display:flex;flex-direction:column;gap:4px;max-height:120px;overflow-y:auto;}
    .saved-mini-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;background:var(--warm);cursor:pointer;font-size:.74rem;font-weight:600;border:1.5px solid transparent;transition:all .13s;}
    .saved-mini-row:hover{border-color:var(--gold);}
    .board-area{display:flex;align-items:center;justify-content:center;background:#2a2a3e;padding:12px;overflow:hidden;}
    canvas#boardCanvas{border-radius:10px;box-shadow:0 14px 44px rgba(0,0,0,.45);display:block;cursor:pointer;}
    .info-panel{background:var(--surface);border-left:1px solid var(--border);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;}
    .event-log{max-height:140px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:3px;}
    .log-entry{font-size:.73rem;padding:4px 7px;border-radius:6px;background:var(--warm);line-height:1.4;}
    .sl-list{display:flex;flex-direction:column;gap:4px;max-height:130px;overflow-y:auto;}
    .sl-row{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:7px;background:var(--warm);font-size:.73rem;}
    .sl-icon{font-size:.88rem;}.sl-val{flex:1;font-weight:600;}
    .sl-del{border:none;background:none;cursor:pointer;color:#ccc;font-size:.76rem;}.sl-del:hover{color:var(--rose);}
    .sl-add{display:flex;gap:4px;margin-top:5px;}
    .sl-num{width:48px;padding:4px 7px;border:1.5px solid var(--border);border-radius:6px;font-size:.74rem;font-family:var(--fb);background:var(--surface);color:var(--ink);outline:none;}
    .sl-num:focus{border-color:var(--gold);}

    /* Popup */
    .popup-overlay{position:fixed;inset:0;background:rgba(28,28,46,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px;animation:fi .2s ease;}
    .popup-box{background:var(--surface);border-radius:20px;padding:0;max-width:700px;width:100%;max-height:92vh;overflow:hidden;box-shadow:0 24px 64px rgba(28,28,46,.2);animation:su .22s ease;display:flex;flex-direction:column;}
    .popup-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
    .popup-header h3{font-family:var(--ff);font-size:1.2rem;font-weight:800;flex:1;}
    .popup-body{flex:1;overflow-y:auto;padding:18px 22px;}
    .popup-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}

    /* Mini slide editor inside popup */
    .mini-stage-wrap{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.1);margin-bottom:14px;cursor:default;}
    .mini-stage{position:relative;user-select:none;}
    .mini-el{position:absolute;cursor:move;}
    .mini-el.sel{outline:2px solid var(--gold);outline-offset:1px;}
    .mini-rh{position:absolute;bottom:-4px;right:-4px;width:9px;height:9px;background:var(--gold);border:1.5px solid #fff;border-radius:2px;cursor:nwse-resize;display:none;}
    .mini-el.sel .mini-rh{display:block;}

    /* Present mode */
    .present-overlay{position:fixed;inset:0;background:#0a0a18;z-index:9000;display:flex;flex-direction:column;}
    .po-nav{padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;color:#fff;flex-shrink:0;}
    .po-logo{font-family:var(--ff);font-weight:900;font-size:1rem;color:var(--gold);}
    .po-body{flex:1;display:flex;overflow:hidden;}
    .po-board{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;background:#1a1a2e;}
    .po-sidebar{width:220px;background:#12121e;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;color:#fff;}
    .po-player{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);}
    .po-player.current{background:rgba(233,168,37,.15);border:1.5px solid rgba(233,168,37,.4);}
    .po-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0;}
    .po-name{font-weight:700;font-size:.88rem;}
    .po-pos{font-size:.72rem;opacity:.6;}
    .po-dice-wrap{background:rgba(255,255,255,.06);border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:.15s;}
    .po-dice-wrap:hover{background:rgba(255,255,255,.12);}
    .po-dice-face{width:72px;height:72px;border-radius:12px;background:var(--surface);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;justify-items:center;padding:9px;margin:0 auto 10px;box-shadow:0 4px 14px rgba(0,0,0,.3);}
    .po-dice-face.rolling{animation:diceRoll .5s ease;}
    .po-log{background:rgba(255,255,255,.04);border-radius:10px;padding:10px;max-height:180px;overflow-y:auto;}
    .po-log-entry{font-size:.73rem;color:rgba(255,255,255,.7);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06);}
    .pc{padding:7px 16px;border-radius:100px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:#fff;font-family:var(--fb);font-weight:600;font-size:.8rem;cursor:pointer;transition:all .15s;}
    .pc:hover{background:rgba(255,255,255,.1);}
    .pc-gold{background:var(--gold);color:var(--ink);border-color:var(--gold);}.pc-gold:hover{background:var(--gold-dk);}

    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:100px;font-size:.78rem;font-weight:600;z-index:9999;animation:tIn .25s ease;pointer-events:none;}
    @keyframes fi{from{opacity:0}to{opacity:1}}
    @keyframes su{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  </style>
</head>
<body>
<nav class="nav">
  <a class="logo" href="index.html">Teacher<span>Kit</span></a>
  <span style="color:#bbb;font-size:.75rem;margin-left:4px">/ Board Game</span>
  <div class="nav-right" id="nav-right"></div>
</nav>
<div class="game-layout" id="game-layout">
  <div style="display:grid;place-items:center;grid-column:1/-1;opacity:.4">Loading…</div>
</div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig, COLLECTIONS } from "./firebase-config.js";

const fbApp=initializeApp(firebaseConfig), auth=getAuth(fbApp), db=getFirestore(fbApp);
const COL=COLLECTIONS.board;

let user=null, saved=[];
const PLAYER_COLORS=['#e9a825','#c8584a','#4a7c6f','#3d7eb5','#7563b8','#e87040'];

// Board config
let config = {
  id:null, name:'',
  gridSize: 10,           // N×N board, configurable 5–20
  snakes: [{from:99,to:40},{from:84,to:58},{from:54,to:19},{from:36,to:6},{from:64,to:60}],
  ladders:[{from:4,to:14},{from:9,to:31},{from:20,to:38},{from:28,to:84},{from:40,to:59},{from:51,to:67},{from:63,to:81},{from:71,to:91}],
  squares: {}, // squareNum → { slide: { bg, elements[] } }
};

let players=[], currentPlayer=0, diceVal=1, rolling=false, log=[], waitingForNextTurn=false;
let presenting=false;

// Mini slide editor state (for popup)
let mse = { slide: null, selId: null, dragging: null, resizing: null, tileBg: null };

onAuthStateChanged(auth, async u=>{
  user=u;
  if(u){ await loadSaved(); buildUI(); }
  else  buildLoginUI();
});

async function loadSaved(){
  const q=query(collection(db,COL),where('uid','==',user.uid));
  const snap=await getDocs(q);
  saved=snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function saveConfig(){
  if(!config.name.trim()){toast('Enter a board name');return;}
  const id=config.id||(config.id='sn_'+Date.now());
  try{
    await setDoc(doc(db,COL,id),{uid:user.uid,...config,updatedAt:serverTimestamp()},{merge:true});
    await loadSaved();renderInfoPanel();toast('Board saved ✓');
  }catch{toast('Save failed');}
}
async function deleteConfig(id){
  await deleteDoc(doc(db,COL,id));
  if(config.id===id)config.id=null;
  await loadSaved();renderInfoPanel();toast('Deleted');
}

/* ── Players ── */
function addPlayer(){
  if(players.length>=6){toast('Max 6 players');return;}
  players.push({name:`Player ${players.length+1}`,pos:0,color:PLAYER_COLORS[players.length]});
  renderControls();drawBoard();
}
function removePlayer(i){
  players.splice(i,1);
  if(currentPlayer>=players.length)currentPlayer=0;
  renderControls();drawBoard();
}

/* ── Dice ── */
const PIP_POS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,1,2,6,7,8]];
function renderDice(val,cls='dice-face'){
  const pips=Array(9).fill(false);(PIP_POS[val]||[]).forEach(i=>pips[i]=true);
  return `<div class="${cls}" id="dice-face">${pips.map(p=>`<div class="dice-pip${p?'':' empty'}"></div>`).join('')}</div>`;
}

function rollDice(){
  if(rolling||!players.length){if(!players.length)toast('Add players first!');return;}
  rolling=true;
  let f=0;
  const iv=setInterval(()=>{
    diceVal=Math.floor(Math.random()*6)+1;
    const df=document.getElementById('dice-face');
    if(df){const pips=Array(9).fill(false);(PIP_POS[diceVal]||[]).forEach(i=>pips[i]=true);
      df.innerHTML=pips.map(p=>`<div class="dice-pip${p?'':' empty'}"></div>`).join('');
      df.classList.add('rolling');}
    if(++f>=8){clearInterval(iv);rolling=false;movePlayer(currentPlayer,diceVal);}
  },80);
}

function movePlayer(pi,steps){
  const p=players[pi];
  const N=config.gridSize, total=N*N;
  let next=p.pos+steps;
  if(next>total)next=total-(next-total);
  if(next<1)next=1;

  const snake=config.snakes.find(s=>s.from===next);
  const ladder=config.ladders.find(l=>l.from===next);
  const isWin=next===total;

  let step=0, prev=p.pos;
  const iv=setInterval(()=>{
    step++;
    p.pos=Math.min(prev+step,next);
    drawBoard();
    if(p.pos>=next){
      clearInterval(iv);
      if(snake){p.pos=snake.to;addLog(`🐍 ${p.name} slid ${next}→${snake.to}`);drawBoard();}
      else if(ladder){p.pos=ladder.to;addLog(`🪜 ${p.name} climbed ${next}→${ladder.to}`);drawBoard();}
      else{addLog(`🎲 ${p.name} rolled ${steps} → sq ${next}`);}
      if(isWin||p.pos===total){addLog(`🏆 ${p.name} WINS!`);showWinPopup(p);}
      renderControls();
      if(presenting) renderPresentPlayers();
      // Don't auto-advance — teacher clicks "Next Player" button
      if(!isWin&&p.pos!==total){ waitingForNextTurn=true; renderControls(); if(presenting)renderPresentPlayers(); }
    }
  },80);
}

function addLog(msg){log.unshift(msg);if(log.length>20)log.pop();updateLog();}
function updateLog(){
  const el=document.getElementById('event-log');if(!el)return;
  el.innerHTML=log.map(l=>`<div class="log-entry">${l}</div>`).join('');
  // also update present log
  const pel=document.getElementById('po-log');if(!pel)return;
  pel.innerHTML=log.map(l=>`<div class="po-log-entry">${l}</div>`).join('');
}

/* ── Board drawing ── */
function getBoardSize(){
  if(presenting){
    const ba=document.getElementById('po-board-canvas');
    const w=ba?.clientWidth||560,h=ba?.clientHeight||560;
    return Math.min(w-20,h-20,640);
  }
  const ba=document.getElementById('board-area');if(!ba)return 520;
  return Math.min(ba.clientWidth-24,ba.clientHeight-24,600);
}

function drawBoard(canvasId='boardCanvas'){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const N=config.gridSize, sz=getBoardSize();
  canvas.width=sz;canvas.height=sz;
  const cell=sz/N;
  const ctx=canvas.getContext('2d');

  const LIGHT='#f8f4ec',DARK='#ede5d6',BORDER='rgba(28,28,46,.08)';

  for(let row=0;row<N;row++){
    for(let col=0;col<N;col++){
      const sq=squareNum(row,col,N);
      const x=col*cell,y=row*cell;
      ctx.fillStyle=(row+col)%2===0?LIGHT:DARK;
      ctx.fillRect(x,y,cell,cell);
      ctx.strokeStyle=BORDER;ctx.lineWidth=.5;ctx.strokeRect(x,y,cell,cell);

      // Square number
      ctx.fillStyle='rgba(28,28,46,.3)';
      ctx.font=`bold ${Math.max(8,Math.round(cell*.18))}px 'DM Sans',sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText(sq,x+cell/2,y+2);

      // Render square slide content (if any)
      const sqData=config.squares[sq];
      if(sqData?.slide){
        renderSquareSlideOnCanvas(ctx,sqData.tileBg,x,y,cell);
      }
    }
  }

  config.snakes.forEach(s=>drawCurve(ctx,s.from,s.to,N,cell,'#c8584a',true));
  config.ladders.forEach(l=>drawCurve(ctx,l.from,l.to,N,cell,'#4a7c6f',false));

  players.forEach((p,pi)=>{
    if(p.pos===0)return;
    const{cx,cy}=cellCenter(p.pos,N,cell);
    const R=cell*.2;
    const offX=(pi-(players.length-1)/2)*R*.9;
    ctx.beginPath();ctx.arc(cx+offX,cy,R,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.round(R*.9)}px 'DM Sans',sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pi+1,cx+offX,cy+1);
  });
}

function renderSquareSlideOnCanvas(ctx,tileBg,x,y,cell){
  // Use separate tile background color (not the popup slide bg)
  ctx.fillStyle=tileBg||'rgba(233,168,37,.35)';
  ctx.fillRect(x,y,cell,cell);
  ctx.font=`${Math.round(cell*.32)}px serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('ℹ',x+cell/2,y+cell*.6);
}

function squareNum(row,col,N){
  const br=N-1-row;
  return br%2===0?br*N+(col+1):br*N+(N-col);
}
function cellCenter(sq,N,cell){
  const br=Math.floor((sq-1)/N);
  const bc=br%2===0?(sq-1)%N:(N-1-((sq-1)%N));
  return{cx:bc*cell+cell/2,cy:(N-1-br)*cell+cell/2};
}
function drawCurve(ctx,from,to,N,cell,color,isSnake){
  const f=cellCenter(from,N,cell),t=cellCenter(to,N,cell);
  const dx=t.cx-f.cx,dy=t.cy-f.cy;
  const mx=(f.cx+t.cx)/2,my=(f.cy+t.cy)/2;
  const cx2=mx+dy*.2,cy2=my-dx*.2;
  ctx.beginPath();ctx.moveTo(f.cx,f.cy);
  ctx.quadraticCurveTo(cx2,cy2,t.cx,t.cy);
  ctx.strokeStyle=color;ctx.lineWidth=isSnake?Math.max(3,cell*.09):Math.max(2,cell*.07);
  ctx.lineCap='round';ctx.setLineDash(isSnake?[]:[cell*.1,cell*.05]);ctx.stroke();ctx.setLineDash([]);
  const angle=Math.atan2(t.cy-cy2,t.cx-cx2);
  const hs=Math.max(6,cell*.15);
  ctx.beginPath();ctx.moveTo(t.cx,t.cy);
  ctx.lineTo(t.cx-hs*Math.cos(angle-.4),t.cy-hs*Math.sin(angle-.4));
  ctx.lineTo(t.cx-hs*Math.cos(angle+.4),t.cy-hs*Math.sin(angle+.4));
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
  ctx.font=`${Math.max(12,Math.round(cell*.2))}px serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(isSnake?'🐍':'🪜',mx,my);
}

/* ── Canvas click: show popup ONLY for occupied square or edit mode ── */
function setupBoardClick(canvasId='boardCanvas'){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  canvas.addEventListener('click',e=>{
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(canvas.width/rect.width);
    const y=(e.clientY-rect.top)*(canvas.height/rect.height);
    const N=config.gridSize;const cell=canvas.width/N;
    const col=Math.floor(x/cell),row=Math.floor(y/cell);
    const sq=squareNum(row,col,N);

    if(presenting){
      // In present mode: only show popup if current player is ON this square
      const p=players[currentPlayer];
      if(p&&p.pos===sq&&config.squares[sq]?.slide){
        showSlidePopup(sq,false);
      } else if(p&&p.pos===sq){
        toast(`You're on square ${sq} — no content here`);
      }
      return;
    }
    // Edit mode: open editor for any square
    showSlidePopup(sq,true);
  });
}

/* ── SLIDE POPUP (mini slide editor) ── */
function showSlidePopup(sq,editable){
  const existing=config.squares[sq]?.slide||null;
  mse.slide = existing ? JSON.parse(JSON.stringify(existing)) : {bg:'#1c1c2e',elements:[]};
  mse.tileBg = config.squares[sq]?.tileBg || null;
  mse.selId = null;
  buildSlidePopup(sq,editable);
}

const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const SLIDE_W=560,SLIDE_H=315;
const BG_COLORS=['#1c1c2e','#4a7c6f','#c8584a','#3d7eb5','#7563b8','#2d4a1e','#ffffff','#fef3c7'];

function buildSlidePopup(sq,editable){

<div class="popup-box">
  <div class="popup-header">

    <button class="btn btn-sm" id="sq-close">✕</button>

      `<button class="btn btn-primary" id="sq-ok">Got it!</button>`}
  </div>

  document.body.appendChild(d);

  // Bind close
  document.getElementById('sq-close')?.addEventListener('click',()=>d.remove());
  document.getElementById('sq-cancel')?.addEventListener('click',()=>d.remove());
  document.getElementById('sq-ok')?.addEventListener('click',()=>d.remove());
  document.getElementById('sq-clear')?.addEventListener('click',()=>{ delete config.squares[sq];d.remove();renderInfoPanel();drawBoard(); });
  document.getElementById('sq-save')?.addEventListener('click',()=>{
    if(!config.squares[sq])config.squares[sq]={};

function renderMiniEls(editable){
  return (mse.slide.elements||[]).map(el=>{
    const sel=mse.selId===el.id;
    const s=`position:absolute;left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;`;
    const selCls=sel?'sel':'';
    const rh=sel?`<div class="mini-rh" data-mrh="${el.id}"></div>`:'';
    if(el.type==='text'){
      const jc=el.align==='center'?'center':el.align==='right'?'flex-end':'flex-start';
      return `<div class="mini-el ${selCls}" data-mel="${el.id}" style="${s}display:flex;align-items:center;justify-content:${jc};font-family:'${el.fontFamily||'DM Sans'}',sans-serif;font-size:${el.fontSize||22}px;color:${el.color||'#fff'};font-weight:${el.bold?700:400};padding:3px;" ${editable?'contenteditable="true"':''}>${esc(el.text||'')}${rh}</div>`;
    }
    if(el.type==='image'){
      return `<div class="mini-el ${selCls}" data-mel="${el.id}" style="${s}">${el.src?`<img src="${el.src}" style="width:100%;height:100%;object-fit:${el.fit||'contain'};display:block"/>`:`<div style="width:100%;height:100%;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.2);border-radius:6px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:.75rem;">Upload →</div>`}${rh}</div>`;
    }
    if(el.type==='shape'){
      const br=el.shape==='circle'?'50%':el.shape==='rounded'?'10px':'3px';
      return `<div class="mini-el ${selCls}" data-mel="${el.id}" style="${s}background:${el.fill||'#e9a825'};opacity:${el.opacity||.85};border-radius:${br};">${rh}</div>`;
    }
    return '';
  }).join('');
}

  return `<div style="background:var(--cream);border-radius:10px;padding:12px;border:1px solid var(--border);margin-top:8px;">
    <div style="font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#aaa;margin-bottom:10px">Element: ${el.type}</div>
    ${el.type==='text'?`
      <div style="margin-bottom:8px"><label style="font-size:.74rem;font-weight:600;color:#555;display:block;margin-bottom:3px">Text</label><textarea id="mp-text" style="width:100%;padding:6px 9px;border:1.5px solid var(--border);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.82rem;resize:none;min-height:48px;outline:none;background:#fff;" oninput="void 0">${esc(el.text||'')}</textarea></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <label style="font-size:.74rem;font-weight:600;color:#555">Size</label>
        <input type="range" id="mp-fs" min="10" max="60" value="${el.fontSize||22}" style="flex:1;accent-color:var(--gold)"/>
        <span id="mp-fs-val" style="font-size:.72rem;color:#999;width:28px">${el.fontSize||22}</span>
        <input type="color" id="mp-color" value="${el.color||'#ffffff'}" style="width:28px;height:24px;border:none;border-radius:4px;cursor:pointer"/>
        <button class="btn btn-sm ${el.bold?'btn-primary':''}" id="mp-bold">B</button>
      </div>
      <div style="display:flex;gap:5px">
        ${['left','center','right'].map(a=>`<button class="btn btn-sm ${el.align===a?'btn-primary':''}" data-mp-align="${a}">${a[0].toUpperCase()}</button>`).join('')}
      </div>
    `:''}
    ${el.type==='image'?`
      <div style="margin-bottom:8px"><label style="font-size:.74rem;font-weight:600;color:#555;display:block;margin-bottom:3px">Image file</label><input type="file" accept="image/*" id="mp-imgfile" style="font-size:.74rem;width:100%"/></div>
      <div style="display:flex;gap:5px">
        ${['contain','cover','fill'].map(f=>`<button class="btn btn-sm ${el.fit===f?'btn-primary':''}" data-mp-fit="${f}">${f}</button>`).join('')}
      </div>
    `:''}
    ${el.type==='shape'?`
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <label style="font-size:.74rem;font-weight:600;color:#555">Fill</label>
        <input type="color" id="mp-fill" value="${el.fill||'#e9a825'}" style="width:28px;height:24px;border:none;border-radius:4px;cursor:pointer"/>
        <input type="range" id="mp-opacity" min="10" max="100" value="${Math.round((el.opacity||.85)*100)}" style="flex:1;accent-color:var(--gold)"/>
        <span id="mp-op-val" style="font-size:.72rem;color:#999">${Math.round((el.opacity||.85)*100)}%</span>
      </div>
      <div style="display:flex;gap:5px">
        ${['rect','rounded','circle'].map(sh=>`<button class="btn btn-sm ${el.shape===sh?'btn-primary':''}" data-mp-shape="${sh}">${sh}</button>`).join('')}
      </div>
    `:''}
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-top:8px">
      ${['x','y','w','h'].map(k=>`<div><div style="font-size:.68rem;font-weight:700;color:#aaa;margin-bottom:2px">${k.toUpperCase()}</div><input type="number" data-mp-pos="${k}" value="${Math.round(el[k]||0)}" style="width:100%;padding:4px 6px;border:1.5px solid var(--border);border-radius:6px;font-size:.76rem;font-family:'DM Sans',sans-serif;outline:none"/></div>`).join('')}
    </div>

function rebuildMiniStage(d,sq,editable){
  const stage=d.querySelector('#mini-stage');
  if(stage){
    stage.style.background=mse.slide.backgroundImage?`url(${mse.slide.backgroundImage}) center/cover`:mse.slide.bg||'#1c1c2e';
    stage.innerHTML=renderMiniEls(editable);
  }
  // Rebuild props
  const body=d.querySelector('.popup-body');
  if(body&&editable){
    // Update action bar del btn
    const delBtn=body.querySelector('#mini-del-el');
    if(mse.selId&&!delBtn){
      const ab=body.querySelector('[data-mini-add="text"]')?.closest('div');
      if(ab)ab.insertAdjacentHTML('beforeend',`<button class="btn btn-danger btn-sm" id="mini-del-el" onclick="void 0">🗑 Delete</button>`);
    }
    // Rebuild props section
    let propsDiv=body.querySelector('#mini-props');
    if(!propsDiv){propsDiv=document.createElement('div');propsDiv.id='mini-props';body.appendChild(propsDiv);}
    propsDiv.innerHTML=mse.selId?renderMiniProps():'';
  }
  // Rebuild BG swatches
  d.querySelectorAll('[data-mini-bg]').forEach(sw=>{ sw.style.border=`2px solid ${mse.slide.bg===sw.dataset.miniBg?'var(--gold)':'transparent'}`; });
  bindMiniDrag(d,sq,editable);
  bindMiniProps(d,sq,editable);
}

function bindMiniDrag(d,sq,editable){
  if(!editable)return;
  const stage=d.querySelector('#mini-stage');if(!stage)return;
  stage.onmousedown=e=>{
    const elDiv=e.target.closest('[data-mel]');
    if(!elDiv){mse.selId=null;rebuildMiniStage(d,sq,editable);return;}
    const elId=elDiv.dataset.mel;
    if(mse.selId!==elId){mse.selId=elId;rebuildMiniStage(d,sq,editable);}
    const el=mse.slide.elements.find(x=>x.id===elId);if(!el)return;
    const isRH=e.target.dataset.mrh;
    const ox=el.x,oy=el.y,ow=el.w,oh=el.h,sx=e.clientX,sy=e.clientY;
    function mv(me){
      const dx=me.clientX-sx,dy=me.clientY-sy;
      if(isRH){el.w=Math.max(40,ow+dx);el.h=Math.max(20,oh+dy);}
      else{el.x=Math.max(0,ox+dx);el.y=Math.max(0,oy+dy);}
      elDiv.style.left=el.x+'px';elDiv.style.top=el.y+'px';
      elDiv.style.width=el.w+'px';elDiv.style.height=el.h+'px';
    }
    function up(){window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);}
    window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
    e.preventDefault();
  };
  // Contenteditable
  stage.querySelectorAll('[contenteditable="true"]').forEach(div=>{
    div.onblur=()=>{const el=mse.slide.elements.find(e=>e.id===div.dataset.mel);if(el)el.text=div.innerText;};
  });
}

function bindMiniProps(d,sq,editable){
  if(!editable||!mse.selId)return;
  const el=mse.slide.elements.find(e=>e.id===mse.selId);if(!el)return;
  const body=d.querySelector('.popup-body');
  body?.querySelector('#mp-text')?.addEventListener('input',e=>{el.text=e.target.value;const stage=d.querySelector('#mini-stage');const div=stage?.querySelector(`[data-mel="${el.id}"]`);if(div)div.innerHTML=esc(el.text||'');});
  body?.querySelector('#mp-fs')?.addEventListener('input',e=>{el.fontSize=+e.target.value;const v=body.querySelector('#mp-fs-val');if(v)v.textContent=e.target.value;rebuildMiniStage(d,sq,editable);});
  body?.querySelector('#mp-color')?.addEventListener('input',e=>{el.color=e.target.value;rebuildMiniStage(d,sq,editable);});
  body?.querySelector('#mp-bold')?.addEventListener('click',()=>{el.bold=!el.bold;rebuildMiniStage(d,sq,editable);});
  body?.querySelectorAll('[data-mp-align]').forEach(b=>b.addEventListener('click',()=>{el.align=b.dataset.mpAlign;rebuildMiniStage(d,sq,editable);}));
  body?.querySelector('#mp-imgfile')?.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{el.src=ev.target.result;rebuildMiniStage(d,sq,editable);};r.readAsDataURL(f);});
  body?.querySelectorAll('[data-mp-fit]').forEach(b=>b.addEventListener('click',()=>{el.fit=b.dataset.mpFit;rebuildMiniStage(d,sq,editable);}));
  body?.querySelector('#mp-fill')?.addEventListener('input',e=>{el.fill=e.target.value;rebuildMiniStage(d,sq,editable);});
  body?.querySelector('#mp-opacity')?.addEventListener('input',e=>{el.opacity=+e.target.value/100;const v=body.querySelector('#mp-op-val');if(v)v.textContent=e.target.value+'%';rebuildMiniStage(d,sq,editable);});
  body?.querySelectorAll('[data-mp-shape]').forEach(b=>b.addEventListener('click',()=>{el.shape=b.dataset.mpShape;rebuildMiniStage(d,sq,editable);}));
  body?.querySelectorAll('[data-mp-pos]').forEach(inp=>inp.addEventListener('change',()=>{el[inp.dataset.mpPos]=+inp.value;rebuildMiniStage(d,sq,editable);}));
}

function startPresent(){
  presenting=true;
  const ov=document.createElement('div');ov.className='present-overlay';ov.id='present-overlay';
  ov.innerHTML=`
<div class="po-nav">
  <span class="po-logo">🎲 ${esc(config.name||'Board Game')}</span>

</div>
<div class="po-body">
  <div class="po-board" id="po-board-canvas" style="flex:1;display:flex;align-items:center;justify-content:center;background:#1a1a2e;">
    <canvas id="po-canvas" style="border-radius:10px;box-shadow:0 14px 44px rgba(0,0,0,.5);cursor:pointer;"></canvas>
  </div>
  <div class="po-sidebar">
    <div style="font-family:'Fraunces',serif;font-weight:800;font-size:.95rem;color:#fff;margin-bottom:4px">Players</div>
    <div id="po-players"></div>
    <div class="po-dice-wrap" id="po-dice-wrap" style="${waitingForNextTurn?'opacity:.4;pointer-events:none':''}">
      ${renderDice(diceVal,'po-dice-face')}
      <div style="color:rgba(255,255,255,.6);font-size:.8rem;font-weight:700">${waitingForNextTurn?'Rolled!':'Click to roll!'}</div>
    </div>
    ${waitingForNextTurn?`<button class="pc pc-gold" id="po-next-player" style="margin-top:4px;width:100%">➡ Next Player</button>`:''}
    <div class="po-log" id="po-log"></div>
    <button class="pc pc-gold" id="po-reset" style="margin-top:auto">↩ Reset</button>
  </div>
</div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{ drawBoard('po-canvas'); setupBoardClick('po-canvas'); renderPresentPlayers(); },50);
  document.getElementById('po-exit')?.addEventListener('click',()=>{presenting=false;ov.remove();drawBoard();});
  document.getElementById('po-dice-wrap')?.addEventListener('click',()=>{rollDice();setTimeout(()=>renderPresentPlayers(),1200);});
  document.getElementById('po-reset')?.addEventListener('click',()=>{players.forEach(p=>p.pos=0);currentPlayer=0;log=[];waitingForNextTurn=false;renderPresentPlayers();drawBoard('po-canvas');updateLog();});
  // Next player binding is on dynamic element, use event delegation
  ov.addEventListener('click',e=>{
    if(e.target.id==='po-next-player'||e.target.closest('#po-next-player')){
      waitingForNextTurn=false;currentPlayer=(currentPlayer+1)%players.length;
      renderPresentPlayers();drawBoard('po-canvas');
    }
  });
  window.addEventListener('resize',()=>{ if(presenting)drawBoard('po-canvas'); });
  updateLog();
}

function renderPresentPlayers(){
  const wrap=document.getElementById('po-players');if(!wrap)return;
  wrap.innerHTML=players.map((p,i)=>`<div class="po-player ${i===currentPlayer?'current':''}">
    <div class="po-dot" style="background:${p.color}">${i+1}</div>
    <div><div class="po-name" style="color:#fff">${esc(p.name)}</div><div class="po-pos">${p.pos>0?'Sq '+p.pos:'Start'}</div></div>
  </div>`).join('');
  // Update dice in present
  const df=document.getElementById('dice-face');
  if(df){const pips=Array(9).fill(false);(PIP_POS[diceVal]||[]).forEach(i=>pips[i]=true);df.innerHTML=pips.map(p=>`<div class="dice-pip${p?'':' empty'}"></div>`).join('');}
}

    <p style="color:#777;margin-bottom:24px;font-size:.88rem;line-height:1.6">Configurable snakes & ladders with rich content on any square.</p>
    <button id="btn-login" style="width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px;border-radius:12px;border:1.5px solid rgba(28,28,46,.1);background:#fff;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;">
      <svg width="19" height="19" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign in with Google
    </button>
    <p style="font-size:.72rem;color:#bbb;margin-top:14px;"><a href="index.html" style="color:#aaa">← Back to TeacherKit</a></p>
  </div>
</div>`;
  document.getElementById('btn-login')?.addEventListener('click',()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>toast('Login failed')));
}

function buildUI(){
  const u=user;const init=(u.displayName||'T').split(' ').map(n=>n[0]).join('').slice(0,2);
  document.getElementById('nav-right').innerHTML=`<div class="avatar">${u.photoURL?`<img src="${u.photoURL}"/>`:`${init}`}</div><button class="btn btn-primary btn-sm" id="btn-present">▶ Present</button><a class="btn btn-sm" href="index.html">← Hub</a>`;
  document.getElementById('btn-present')?.addEventListener('click',startPresent);
  document.getElementById('game-layout').innerHTML=`
<div class="controls-panel" id="controls-panel"></div>
<div class="board-area" id="board-area"><canvas id="boardCanvas"></canvas></div>
<div class="info-panel" id="info-panel"></div>`;
  renderControls();renderInfoPanel();
  setTimeout(()=>{drawBoard();setupBoardClick();},50);
  window.addEventListener('resize',()=>drawBoard());
}

function renderControls(){
  const cp=document.getElementById('controls-panel');if(!cp)return;
  cp.innerHTML=`
<div style="font-family:var(--ff);font-weight:800;font-size:.95rem;">🎲 Game Controls</div>
<div class="sec">
  <h4>Players (${players.length}/6)</h4>
  ${players.map((p,i)=>`<div class="player-row ${i===currentPlayer?'player-turn':''}">
    <div class="player-dot" style="background:${p.color}">${i+1}</div>
    <span class="player-name">${esc(p.name)}</span>
    <span class="player-pos">sq ${p.pos||'start'}</span>
    <button class="btn btn-sm" style="padding:2px 7px;font-size:.66rem;color:${p.color};border-color:${p.color}" data-del-player="${i}">✕</button>
  </div>`).join('')}
  <button class="btn btn-sm" id="add-player-btn" style="width:100%;margin-top:7px" ${players.length>=6?'disabled':''}>+ Add Player</button>
</div>
<div class="sec">
  <h4>Roll Dice</h4>
  <div style="display:flex;flex-direction:column;align-items:center;gap:9px;">
    ${renderDice(diceVal)}
    ${waitingForNextTurn
      ? `<button class="btn btn-sage" id="next-player-btn" style="width:100%">➡ Next Player (${players[(currentPlayer+1)%players.length]?.name||''})</button>`
      : `<button class="btn btn-gold" id="roll-btn" ${rolling||!players.length?'disabled':''} style="width:100%">🎲 Roll!</button>`}
    <button class="btn btn-sm" id="reset-btn" style="width:100%">↩ Reset</button>
  </div>
</div>`;
  document.getElementById('add-player-btn')?.addEventListener('click',addPlayer);
  document.getElementById('roll-btn')?.addEventListener('click',rollDice);
  document.getElementById('next-player-btn')?.addEventListener('click',()=>{waitingForNextTurn=false;currentPlayer=(currentPlayer+1)%players.length;renderControls();drawBoard();});
  document.getElementById('reset-btn')?.addEventListener('click',()=>{players.forEach(p=>p.pos=0);currentPlayer=0;log=[];waitingForNextTurn=false;renderControls();drawBoard();updateLog();});
  document.querySelectorAll('[data-del-player]').forEach(btn=>btn.addEventListener('click',()=>removePlayer(+btn.dataset.delPlayer)));
}

function renderInfoPanel(){
  const ip=document.getElementById('info-panel');if(!ip)return;
  ip.innerHTML=`
<div style="font-family:var(--ff);font-weight:800;font-size:.9rem;">⚙️ Board Config</div>
<div class="sec">
  <h4>Board</h4>
  <div class="fi"><label>Name</label><input class="fi-inp" id="board-name" value="${esc(config.name)}" placeholder="e.g. Online Safety"/></div>
  <div class="fi"><label>Grid</label>
    <select class="fi-inp" id="grid-size" style="max-width:80px">
      ${[5,6,7,8,9,10,12,15,20].map(n=>`<option value="${n}" ${config.gridSize===n?'selected':''}>${n}×${n}</option>`).join('')}
    </select>
    <span style="font-size:.72rem;color:#aaa;margin-left:4px">(${config.gridSize*config.gridSize} squares)</span>
  </div>
  <button class="btn btn-gold btn-sm" id="btn-save-board" style="width:100%;margin-top:5px">💾 Save Board</button>
</div>
<div class="sec">
  <h4>Snakes 🐍</h4>
  <div class="sl-list">${config.snakes.map((s,i)=>`<div class="sl-row"><span class="sl-icon">🐍</span><span class="sl-val">${s.from} → ${s.to}</span><button class="sl-del" data-del-snake="${i}">✕</button></div>`).join('')}</div>
  <div class="sl-add"><input class="sl-num" id="snake-from" placeholder="From" type="number"/><input class="sl-num" id="snake-to" placeholder="To" type="number"/><button class="btn btn-sm" id="add-snake">Add</button></div>
</div>
<div class="sec">
  <h4>Ladders 🪜</h4>
  <div class="sl-list">${config.ladders.map((l,i)=>`<div class="sl-row"><span class="sl-icon">🪜</span><span class="sl-val">${l.from} → ${l.to}</span><button class="sl-del" data-del-ladder="${i}">✕</button></div>`).join('')}</div>
  <div class="sl-add"><input class="sl-num" id="ladder-from" placeholder="From" type="number"/><input class="sl-num" id="ladder-to" placeholder="To" type="number"/><button class="btn btn-sm" id="add-ladder">Add</button></div>
</div>
<div class="sec">
  <h4>Square Content <span style="font-size:.65rem;font-weight:400;color:#aaa">(click any square on board to edit)</span></h4>
  <div class="sl-list">${Object.entries(config.squares).filter(([,v])=>v.slide).map(([k])=>`<div class="sl-row"><span>sq ${k}</span><span class="sl-val" style="color:var(--gold)">✦ Has content</span><button class="sl-del" data-del-sq="${k}">✕</button></div>`).join('')||'<div style="font-size:.72rem;color:#bbb;padding:3px 0">None — click a square to add</div>'}</div>
</div>
<div class="sec">
  <h4>Saved Boards (${saved.length})</h4>
  <div class="saved-mini">
    ${saved.map(s=>`<div class="saved-mini-row" data-load-board="${s.id}"><span style="flex:1">${esc(s.name||'Untitled')}</span><button class="btn btn-danger btn-sm" data-del-board="${s.id}" style="padding:2px 7px">🗑</button></div>`).join('')||'<span style="font-size:.72rem;color:#bbb">None saved yet</span>'}
  </div>
</div>
<div class="sec">
  <h4>Event Log</h4><div class="event-log" id="event-log"></div>
</div>`;

  document.getElementById('board-name')?.addEventListener('input',e=>config.name=e.target.value);
  document.getElementById('grid-size')?.addEventListener('change',e=>{
    config.gridSize=+e.target.value;
    // Remove snakes/ladders that are out of range
    const max=config.gridSize*config.gridSize;
    config.snakes=config.snakes.filter(s=>s.from<=max&&s.to<=max);
    config.ladders=config.ladders.filter(l=>l.from<=max&&l.to<=max);
    players.forEach(p=>{if(p.pos>max)p.pos=0;});
    renderInfoPanel();drawBoard();
  });
  document.getElementById('btn-save-board')?.addEventListener('click',saveConfig);
  document.querySelectorAll('[data-del-snake]').forEach(btn=>btn.addEventListener('click',()=>{config.snakes.splice(+btn.dataset.delSnake,1);renderInfoPanel();drawBoard();}));
  document.querySelectorAll('[data-del-ladder]').forEach(btn=>btn.addEventListener('click',()=>{config.ladders.splice(+btn.dataset.delLadder,1);renderInfoPanel();drawBoard();}));
  document.querySelectorAll('[data-del-sq]').forEach(btn=>btn.addEventListener('click',()=>{delete config.squares[btn.dataset.delSq];renderInfoPanel();drawBoard();}));
  document.getElementById('add-snake')?.addEventListener('click',()=>{const f=+document.getElementById('snake-from').value,t=+document.getElementById('snake-to').value;if(f>0&&t>0&&f!==t){config.snakes.push({from:f,to:t});renderInfoPanel();drawBoard();}});
  document.getElementById('add-ladder')?.addEventListener('click',()=>{const f=+document.getElementById('ladder-from').value,t=+document.getElementById('ladder-to').value;if(f>0&&t>0&&f!==t){config.ladders.push({from:f,to:t});renderInfoPanel();drawBoard();}});
  document.querySelectorAll('[data-load-board]').forEach(row=>row.addEventListener('click',e=>{if(e.target.dataset.delBoard)return;const s=saved.find(x=>x.id===row.dataset.loadBoard);if(s){config=JSON.parse(JSON.stringify(s));players.forEach(p=>p.pos=0);renderInfoPanel();drawBoard();}}));
  document.querySelectorAll('[data-del-board]').forEach(btn=>btn.addEventListener('click',async e=>{e.stopPropagation();await deleteConfig(btn.dataset.delBoard);}));
  updateLog();
}

function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
</script>
</body>
</html>
