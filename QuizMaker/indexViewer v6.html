<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phishing Quiz Viewer</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;margin:0;background:#f6f8fb;color:#111}
    .panel{max-width:960px;margin:20px auto;background:#fff;padding:16px;border-radius:12px;box-shadow:0 6px 18px rgba(20,30,70,0.08)}
    h2{margin-top:0}
    canvas{background:#222;border-radius:8px;display:block;max-width:100%;height:auto;margin-bottom:8px}
    button,input[type=file]{background:#0b79d0;color:#fff;border:none;padding:8px 10px;border-radius:8px;cursor:pointer;margin-right:8px;margin-bottom:8px}
    button.ghost{background:#fff;color:#0b79d0;border:1px solid #0b79d0}
    .small{font-size:0.85rem;color:#555}
    .result{padding:12px;border-radius:10px;background:#f6f6f6;margin-top:16px}
    .feedback{margin-top:12px;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fafafa;max-height:300px;overflow-y:auto;display:none}
  </style>
</head>
<body>

<div class="panel">
  <h2>Viewer — Take Quiz</h2>
  <input id="jsonFile" type="file" accept="application/json">
  <button id="loadBtn">Load Quiz</button>

  <canvas id="viewerCanvas" width="800" height="480"></canvas>

  <div>
    <button id="chooseTrue" class="ghost">Mark True</button>
    <button id="chooseFalse" class="ghost">Mark False</button>
    <span class="small">Your choice: <span id="userChoice">—</span></span>
  </div>

  <div>
    <button id="prevBtn" class="ghost">Previous Slide</button>
    <button id="nextBtn" class="ghost">Next Slide</button>
    <button id="submitBtn" class="ghost">Submit Quiz</button>
    <button id="breakdownBtn" class="ghost">Show Breakdown</button>
    <button id="feedbackBtn" class="ghost">Show Correct Ranges</button>
  </div>

  <div id="progress" class="small">0 / 0</div>
  <div id="finalResult" class="result" style="display:none"></div>
  <div id="feedback" class="feedback"></div>

  <a href="index.html" class="ghost" style="padding:8px 12px;display:inline-block;text-decoration:none">Back to Editor</a>
</div>

<script>
const $=id=>document.getElementById(id);
const viewerCanvas=$('viewerCanvas');
const vCtx=viewerCanvas.getContext('2d');
let quiz={slides:[]},index=0,userAnswers=[];
let showRanges=false, showBreakdown=false;

function fitCanvasToImage(canvas,img){
  const maxW=800,maxH=480;
  let w=img.width,h=img.height;
  const ratio=Math.min(maxW/w,maxH/h,1);
  w=Math.round(w*ratio);h=Math.round(h*ratio);
  canvas.width=w;canvas.height=h;
}

function drawSlide(){
  vCtx.clearRect(0,0,viewerCanvas.width,viewerCanvas.height);
  const slide=quiz.slides[index]; if(!slide)return;
  const img=new Image(); img.onload=()=>{
    fitCanvasToImage(viewerCanvas,img);
    vCtx.drawImage(img,0,0,viewerCanvas.width,viewerCanvas.height);

    // Draw user clicks
    const ans=userAnswers[index]||{clicks:[]};
    ans.clicks.forEach(c=>{
      vCtx.beginPath();
      vCtx.arc(c.x*viewerCanvas.width,c.y*viewerCanvas.height,8,0,Math.PI*2);
      vCtx.fillStyle='rgba(0,120,0,0.6)'; vCtx.fill();
      vCtx.strokeStyle='#fff'; vCtx.stroke();
    });

    // Draw correct ranges if feedback active
    if(showRanges){
      slide.points.forEach((p,i)=>{
        const px=p.x*viewerCanvas.width, py=p.y*viewerCanvas.height;
        vCtx.beginPath();
        vCtx.arc(px,py,p.r||28,0,Math.PI*2);
        vCtx.strokeStyle='orange';
        vCtx.lineWidth=2;
        vCtx.stroke();
        vCtx.fillStyle='orange';
        vCtx.fillText(`P${i+1}`, px-8, py-10);
      });
    }
  };
  img.src=slide.image;

  // Use dynamic labels from slide
  const trueLabel = slide.labels?.trueLabel || 'Malicious';
  const falseLabel = slide.labels?.falseLabel || 'Real';
  $('chooseTrue').innerText = trueLabel;
  $('chooseFalse').innerText = falseLabel;

  $('userChoice').innerText=(userAnswers[index]&&userAnswers[index].choice!=null)?(userAnswers[index].choice?trueLabel:falseLabel):'—';
  $('progress').innerText=`${index+1} / ${quiz.slides.length}`;
  $('submitBtn').style.display=(index===quiz.slides.length-1)?'inline-block':'none';
}

function getClickCoords(e,canvas){
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width;
  const y=(e.clientY-rect.top)/rect.height;
  return {x,y};
}

// Click handling for marking points
viewerCanvas.addEventListener('click',e=>{
  if(!quiz.slides.length)return;
  const {x,y}=getClickCoords(e,viewerCanvas);
  if(!userAnswers[index])userAnswers[index]={clicks:[],choice:null,details:[]};

  for(let i=0;i<userAnswers[index].clicks.length;i++){
    const c=userAnswers[index].clicks[i];
    const dist=Math.hypot((x-c.x)*viewerCanvas.width,(y-c.y)*viewerCanvas.height);
    if(dist<20){userAnswers[index].clicks.splice(i,1);drawSlide();return;}
  }

  userAnswers[index].clicks.push({x,y});
  drawSlide();
});

// Choice buttons use dynamic labels
$('chooseTrue').onclick=()=>{if(!userAnswers[index])userAnswers[index]={clicks:[],choice:null}; userAnswers[index].choice=true; drawSlide();};
$('chooseFalse').onclick=()=>{if(!userAnswers[index])userAnswers[index]={clicks:[],choice:null}; userAnswers[index].choice=false; drawSlide();};

// Scoring logic
function calculateScores(){
  userAnswers.forEach((ans,i)=>{
    const slide=quiz.slides[i];
    if(!ans)ans={clicks:[],choice:null,details:[]};
    ans.raw=0; 
    ans.max=1+(slide.points?slide.points.length:0); 
    ans.details=[];

    if(ans.choice===slide.is_malicious){ ans.raw+=1; ans.details.push(`+1: Correct (${slide.labels?.trueLabel || 'Malicious'}) / (${slide.labels?.falseLabel || 'Real'})`); }
    else{ ans.raw-=1; ans.details.push(`-1: Incorrect`); }

    const found=new Array(slide.points.length).fill(false);

    ans.clicks.forEach((c,ci)=>{
      let best=-1,bestD=1e9;
      slide.points.forEach((p,pi)=>{
        const dx=(c.x-p.x)*viewerCanvas.width;
        const dy=(c.y-p.y)*viewerCanvas.height;
        const d=Math.hypot(dx,dy);
        if(d<bestD){bestD=d; best=pi;}
      });
      if(best>=0 && bestD<=slide.points[best].r){
        if(!found[best]){ ans.raw+=1; found[best]=true; ans.details.push(`+1: Click ${ci+1} correct for point ${best+1}`); }
        else{ ans.raw-=0.5; ans.details.push(`-0.5: Click ${ci+1} duplicate on point ${best+1}`); }
      } else{ ans.details.push(`-0.5: Click ${ci+1} incorrect`); ans.raw-=0.5; }
    });

    slide.points.forEach((p,pi)=>{
      if(!found[pi]) ans.details.push(`0: Point ${pi+1} was not clicked`);
    });
  });
}

// Buttons
$('submitBtn').onclick=()=>{
  calculateScores();
  let total=0,max=0;
  userAnswers.forEach(a=>{if(!a)return; total+=(a.raw||0); max+=(a.max||0);});
  const percent=max>0?Math.max(0,Math.round((total/max)*100)):0;
  $('finalResult').style.display='block';
  $('finalResult').innerText=`Final Score: ${percent}%`;
};

$('breakdownBtn').onclick=()=>{
  showBreakdown=!showBreakdown;
  const fb=$('feedback');
  if(showBreakdown){
    calculateScores();
    fb.innerHTML='';
    userAnswers.forEach((ans,i)=>{
      const slideTitle=`<strong>Slide ${i+1}</strong>`;
      const detailsList=(ans.details||[]).map(d=>`<li>${d}</li>`).join('');
      fb.innerHTML+=`<div>${slideTitle}<ul>${detailsList}</ul></div>`;
    });
    fb.style.display='block';
    $('breakdownBtn').innerText='Hide Breakdown';
  } else {
    fb.style.display='none';
    $('breakdownBtn').innerText='Show Breakdown';
  }
};

$('feedbackBtn').onclick=()=>{
  showRanges=!showRanges;
  drawSlide();
};

$('nextBtn').onclick=()=>{if(index<quiz.slides.length-1){index++; drawSlide();}};
$('prevBtn').onclick=()=>{if(index>0){index--; drawSlide();}};

// Load quiz JSON
$('loadBtn').onclick=()=>{
  const f=$('jsonFile').files[0]; if(!f)return;
  const r=new FileReader(); 
  r.onload=ev=>{
    quiz=JSON.parse(ev.target.result); 
    index=0; 
    userAnswers=[]; 
    drawSlide();
  }; 
  r.readAsText(f);
};
</script>

</body>
</html>
