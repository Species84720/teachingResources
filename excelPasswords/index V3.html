<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Credentials Generator</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        font-size: 32px; /* double default */
    }
    input, button {
        margin: 5px 0;
        padding: 5px;
        font-size: 16px;
    }
    .printable-table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 20px;
    }
    .printable-table td {
        border: 1px solid #000;
        padding: 10px 15px;
        page-break-inside: avoid;
    }
    .spacer {
        height: 2px; /* smaller spacing */
    }
    @media print {
        @page { margin: 0; }
        body { margin: 0; }
        .input-area { display: none; } /* hide inputs when printing */
    }
</style>
</head>
<body>

<div class="input-area">
    <h2>Student Credentials Generator</h2>
    <label>Upload Excel File:</label>
    <input type="file" id="fileInput" accept=".xlsx, .xls"><br>

    <label>Row where student names start (1-based):</label>
    <input type="number" id="startRow" min="1" value="2"><br>

    <label>Username column (A, B, ...):</label>
    <input type="text" id="usernameCol" maxlength="1" value="A"><br>

    <label>Password column (A, B, ...):</label>
    <input type="text" id="passwordCol" maxlength="1" value="B"><br>

    <button onclick="generateTable()">Generate Printable Table</button>
    <button onclick="printCards()">Print Cards</button>
</div>

<div id="tableContainer"></div>

<script>
function columnLetterToIndex(letter) {
    return letter.toUpperCase().charCodeAt(0) - 65;
}

function generateTable() {
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files[0]) {
        alert("Please select an Excel file first.");
        return;
    }

    const startRow = parseInt(document.getElementById('startRow').value) - 1;
    const usernameCol = columnLetterToIndex(document.getElementById('usernameCol').value);
    const passwordCol = columnLetterToIndex(document.getElementById('passwordCol').value);

    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

        let html = '<table class="printable-table">';
        jsonData.slice(startRow).forEach(row => {
            const username = row[usernameCol] || '';
            const password = row[passwordCol] || '';
            if(username || password) {
                html += `
                <tr>
                    <td>Username</td>
                    <td>${username}</td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>${password}</td>
                </tr>
                <tr class="spacer"><td colspan="2"></td></tr>
                `;
            }
        });
        html += '</table>';

        const container = document.getElementById('tableContainer');
        container.innerHTML = html;

        // Allow browser to render table before printing
        setTimeout(() => {
            printCards();
        }, 500);
    };
    reader.readAsArrayBuffer(fileInput.files[0]);
}

function printCards() {
    const cardsHtml = document.getElementById('tableContainer').innerHTML;
    const printWindow = window.open('', '', 'width=800,height=600');
    printWindow.document.write(`
        <html>
        <head>
        <title>Print</title>
        <style>
            body { font-family: Arial; font-size: 32px; margin: 0; }
            .card { border: 1px solid #000; padding: 10px 15px; margin-bottom: 2px; display: inline-block; page-break-inside: avoid; }
            .card-row { margin-bottom: 5px; }
        </style>
        </head>
        <body>
            ${cardsHtml}
        </body>
        </html>
    `);
    printWindow.document.close();
    printWindow.focus();
    printWindow.print();
    // Optionally close after printing: printWindow.close();
}
</script>

</body>
</html>
