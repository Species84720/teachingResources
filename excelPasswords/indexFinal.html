<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Credentials Generator</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        font-size: 32px; /* double font */
    }
    input, button {
        margin: 5px 0;
        padding: 5px;
        font-size: 16px;
    }
    .input-area { margin-bottom: 20px; }
    #cardsContainer .card {
        display: block;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #000;
        padding: 10px 15px;
        margin-bottom: 2px; /* small spacing */
        page-break-inside: avoid; /* keep card together */
    }
    .card-row { margin-bottom: 5px; }
</style>
</head>
<body>

<div class="input-area">
    <h2>Student Credentials Generator</h2>
    <label>Upload Excel File:</label>
    <input type="file" id="fileInput" accept=".xlsx, .xls"><br>

    <label>Row where student names start (1-based):</label>
    <input type="number" id="startRow" min="1" value="2"><br>

    <label>Username column (A, B, ...):</label>
    <input type="text" id="usernameCol" maxlength="1" value="A"><br>

    <label>Password column (A, B, ...):</label>
    <input type="text" id="passwordCol" maxlength="1" value="B"><br>

    <button onclick="generateCards()">Generate Printable Cards</button>
    <button onclick="printCards()">Print Cards</button>
</div>

<div id="cardsContainer"></div>

<script>
function columnLetterToIndex(letter) {
    return letter.toUpperCase().charCodeAt(0) - 65;
}

function generateCards() {
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files[0]) {
        alert("Please select an Excel file first.");
        return;
    }

    const startRow = parseInt(document.getElementById('startRow').value) - 1;
    const usernameCol = columnLetterToIndex(document.getElementById('usernameCol').value);
    const passwordCol = columnLetterToIndex(document.getElementById('passwordCol').value);

    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        const container = document.getElementById('cardsContainer');
        container.innerHTML = ''; // clear previous

        jsonData.slice(startRow).forEach(row => {
            const username = row[usernameCol] || '';
            const password = row[passwordCol] || '';
            if(username || password) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-row"><strong>Username:</strong> ${username}</div>
                    <div class="card-row"><strong>Password:</strong> ${password}</div>
                `;
                container.appendChild(card);
            }
        });

        alert('Cards generated! Click "Print Cards" when ready.');
    };
    reader.readAsArrayBuffer(fileInput.files[0]);
}

function printCards() {
    const cardsHtml = document.getElementById('cardsContainer').innerHTML;
    if (!cardsHtml) {
        alert('No cards to print. Please generate cards first.');
        return;
    }

    const printWindow = window.open('', '', 'width=1000,height=800');
    printWindow.document.write(`
        <html>
        <head>
        <title>Print</title>
        <style>
            html, body { margin: 0; padding: 0; width: 100%; font-family: Arial; font-size: 32px; }
            .container { width: 100%; }
            .card { display: block; width: 100%; box-sizing: border-box; border: 1px solid #000; padding: 10px 15px; margin-bottom: 2px; page-break-inside: avoid; }
            .card-row { margin-bottom: 5px; }
        </style>
        </head>
        <body>
            <div class="container">
                ${cardsHtml}
            </div>
        </body>
        </html>
    `);
    printWindow.document.close();
    printWindow.focus();
    printWindow.print();
}
</script>

</body>
</html>
