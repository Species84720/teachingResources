<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Credentials Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, button {
            margin: 5px 0;
            padding: 5px;
        }
        .printable-table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        .printable-table td, .printable-table th {
            border: 1px solid #000;
            padding: 8px;
            page-break-inside: avoid; /* prevent splitting on page */
        }
        @media print {
            button, input, label {
                display: none;
            }
        }
    </style>
</head>
<body>

<h2>Student Credentials Generator</h2>

<label>Upload Excel File:</label>
<input type="file" id="fileInput" accept=".xlsx, .xls"><br>

<label>Row where student names start (1-based):</label>
<input type="number" id="startRow" min="1" value="2"><br>

<label>Username column (A, B, ...):</label>
<input type="text" id="usernameCol" maxlength="1" value="A"><br>

<label>Password column (A, B, ...):</label>
<input type="text" id="passwordCol" maxlength="1" value="B"><br>

<button onclick="generateTable()">Generate Printable Table</button>

<div id="tableContainer"></div>

<script>
function columnLetterToIndex(letter) {
    return letter.toUpperCase().charCodeAt(0) - 65;
}

function generateTable() {
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files[0]) {
        alert("Please select an Excel file first.");
        return;
    }

    const startRow = parseInt(document.getElementById('startRow').value) - 1; // convert to 0-based
    const usernameCol = columnLetterToIndex(document.getElementById('usernameCol').value);
    const passwordCol = columnLetterToIndex(document.getElementById('passwordCol').value);

    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

        let html = '<table class="printable-table">';
        jsonData.slice(startRow).forEach(row => {
            const username = row[usernameCol] || '';
            const password = row[passwordCol] || '';
            if(username || password) {
                html += `
                <tr>
                    <td>Username</td>
                    <td>${username}</td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>${password}</td>
                </tr>
                <tr><td colspan="2" style="height: 20px;"></td></tr>
                `;
            }
        });
        html += '</table>';

        const container = document.getElementById('tableContainer');
        container.innerHTML = html;

        window.print(); // directly open print dialog
    };
    reader.readAsArrayBuffer(fileInput.files[0]);
}
</script>

</body>
</html>
