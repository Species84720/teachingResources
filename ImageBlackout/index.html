<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Torch Blackout with Labels</title>
    <style>
      @keyframes shake {
        0% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        50% {
          transform: translateX(5px);
        }
        75% {
          transform: translateX(-5px);
        }
        100% {
          transform: translateX(0);
        }
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        font-family: sans-serif;
        overflow: hidden;
        color: white;
      }

      #app {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      #canvasContainer {
        width: 100%;
        height: 100%;
        position: relative;
      }

      canvas {
        display: block;
        background: black;
      }

      #labelSidebar {
        width: 0;
        background: #222;
        transition: width 0.3s;
        overflow-y: auto;
        padding: 10px;
      }

      #labelSidebar.show {
        width: 20%;
      }

      #labelSidebar h3 {
        margin-top: 0;
      }

      .label {
        background: #444;
        margin: 5px;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: grab;
        color: white;
        font-size: xxx-large;
      }

      .label.placed {
        position: absolute;
        z-index: 5;
        pointer-events: auto;
        background: #fff;
        color: #000;
        padding: 4px 8px;
        border-radius: 5px;
        font-weight: bold;
        border: 1px solid #000;
      }

      .dropzone {
        position: absolute;
        min-width: 100px;
        height: 40px;
        border: 2px dashed #888;
        border-radius: 8px;
        z-index: 5;
      }

      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
      }

      #controls input[type="file"],
      #controls button {
        font-size: 1rem;
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvasContainer">
        <canvas id="canvas"></canvas>
        <div id="controls">
          <button id="modeToggle">Switch to Edit Mode</button>

          <div id="editControls" style="display: none">
            <button id="uploadImage">Upload Image</button>
            <input type="file" id="imageInput" accept="image/*" hidden />
            <button id="loadLabels">Upload Labels</button>
            <input type="file" id="labelInput" accept=".json" hidden />
            <button id="toggleReveal">Reveal Full Image</button>
            <button id="saveTemplate">Save Template</button>
            <button id="loadTemplate">Load Template</button>
            <input type="file" id="loadTemplateInput" accept=".json" hidden />
          </div>

          <div id="viewControls">
            <button id="loadTemplateView">Load Template</button>
            <input
              type="file"
              id="loadTemplateInputView"
              accept=".json"
              hidden
            />
            <button id="toggleRevealView">Reveal Full Image</button>
          </div>
        </div>
      </div>

      <div id="labelSidebar">
        <h3>Labels</h3>
        <div id="labelList"></div>
      </div>
    </div>

    <script>
      let editMode = false;
      let currentTemplate = null;

      const modeToggleBtn = document.getElementById("modeToggle");
      const editControls = document.getElementById("editControls");
      const viewControls = document.getElementById("viewControls");

      modeToggleBtn.addEventListener("click", () => {
        editMode = !editMode;
        modeToggleBtn.textContent = editMode
          ? "Switch to View Mode"
          : "Switch to Edit Mode";
        editControls.style.display = editMode ? "block" : "none";
        viewControls.style.display = editMode ? "none" : "block";
        resetCanvasAndLabels(false);
      });

      function resetCanvasAndLabels(show) {
        document.querySelectorAll(".label.placed").forEach((l) => l.remove());
        document.querySelectorAll(".dropzone").forEach((z) => z.remove());
        labelList.innerHTML = "";

        if (show && !editMode && imgLoaded && currentTemplate?.labels) {
          createDropZonesFromTemplate(currentTemplate);
          showLabelSidebar(currentTemplate.labels.map((l) => l.text));
        }
      }

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const imageInput = document.getElementById("imageInput");
      const uploadImageBtn = document.getElementById("uploadImage");
      const toggleRevealBtn = document.getElementById("toggleReveal");
      const toggleRevealViewBtn = document.getElementById("toggleRevealView");
      const labelInput = document.getElementById("labelInput");
      const loadLabelsBtn = document.getElementById("loadLabels");
      const labelSidebar = document.getElementById("labelSidebar");
      const labelList = document.getElementById("labelList");
      const canvasContainer = document.getElementById("canvasContainer");
      const saveTemplateBtn = document.getElementById("saveTemplate");

      const torch = new Image();
      torch.src = "torch.png";
      let torchLoaded = false;
      torch.onload = () => (torchLoaded = true);

      let img = new Image();
      let imgLoaded = false;

      let revealX = window.innerWidth / 2;
      let revealY = window.innerHeight / 2;
      let revealRadius = 100;
      let dragging = false;
      let showAll = false;

      let imgDrawWidth = 0;
      let imgDrawHeight = 0;
      let imgOffsetX = 0;
      let imgOffsetY = 0;

      function resizeCanvas() {
        canvas.width = canvasContainer.clientWidth;
        canvas.height = canvasContainer.clientHeight;
        if (imgLoaded) {
          scaleImage();
          draw();
        }
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      imageInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (event) {
            img.onload = () => {
              imgLoaded = true;
              showAll = false;
              toggleRevealBtn.disabled = false;
              toggleRevealViewBtn.disabled = false;
              scaleImage();
              draw();
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      function revealToggle() {
        showAll = !showAll;
        toggleRevealBtn.textContent = showAll
          ? "Hide Again"
          : "Reveal Full Image";
        toggleRevealViewBtn.textContent = showAll
          ? "Hide Again"
          : "Reveal Full Image";

        // Toggle sidebar visibility
        if (showAll) {
          labelSidebar.classList.add("show");
          canvasContainer.style.width = "80%";
        } else {
          labelSidebar.classList.remove("show");
          canvasContainer.style.width = "100%";
        }

        resizeCanvas();
        draw();

        // If we're in VIEW mode, and template is loaded, then render drop zones
        if (!editMode) {
          resetCanvasAndLabels(showAll); // drop zones drawn only if showAll
        }

        // Toggle placed label visibility (EDIT mode)
        if (editMode) {
          const labels = document.querySelectorAll(".label.placed");
          labels.forEach((label) => {
            label.style.display = showAll ? "block" : "none";
          });
        }
      }

      toggleRevealBtn.addEventListener("click", () => {
        revealToggle();
      });
      toggleRevealViewBtn.addEventListener("click", () => {
        revealToggle();
      });

      canvas.addEventListener("mousedown", (e) => {
        if (e.target.classList.contains("label")) return;
        dragging = true;
        moveCircle(e);
      });

      canvas.addEventListener("mousemove", (e) => {
        if (dragging) moveCircle(e);
      });

      canvas.addEventListener("mouseup", () => (dragging = false));
      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        revealRadius -= Math.sign(e.deltaY) * 10;
        revealRadius = Math.max(20, Math.min(revealRadius, canvas.height));
        draw();
      });

      canvas.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          if (e.touches.length === 1) {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            revealX = touch.clientX - rect.left;
            revealY = touch.clientY - rect.top;
            draw();
          }
        },
        { passive: false }
      );

      function moveCircle(e) {
        const rect = canvas.getBoundingClientRect();
        revealX = e.clientX - rect.left;
        revealY = e.clientY - rect.top;
        draw();
      }

      function scaleImage() {
        imgDrawHeight = canvas.height;
        imgDrawWidth = (img.width / img.height) * canvas.height;
        imgOffsetX = (canvas.width - imgDrawWidth) / 2;
        imgOffsetY = 0;
      }

      function draw() {
        if (!imgLoaded) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, imgOffsetX, imgOffsetY, imgDrawWidth, imgDrawHeight);
        if (!showAll) {
          ctx.fillStyle = "black";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.beginPath();
          ctx.arc(revealX, revealY, revealRadius, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(
            img,
            imgOffsetX,
            imgOffsetY,
            imgDrawWidth,
            imgDrawHeight
          );
          ctx.restore();
          if (torchLoaded) {
            const torchSize = revealRadius * 2;
            const torchOffsetX = -revealRadius * 0.8;
            const torchOffsetY = revealRadius * 0.6;
            ctx.drawImage(
              torch,
              revealX + torchOffsetX - torchSize / 2,
              revealY + torchOffsetY - torchSize / 2,
              torchSize,
              torchSize
            );
          }
        }
      }

      uploadImageBtn.addEventListener("click", () => imageInput.click());
      loadLabelsBtn.addEventListener("click", () => labelInput.click());

      labelInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const data = JSON.parse(event.target.result);
              if (Array.isArray(data.labels)) {
                showLabelSidebar(data.labels);
              } else {
                alert("JSON must contain an array of 'labels'");
              }
            } catch (err) {
              alert("Invalid JSON file.");
            }
          };
          reader.readAsText(file);
        }
      });

      function showLabelSidebar(labels) {
        labelSidebar.classList.add("show");
        canvasContainer.style.width = "80%";
        resizeCanvas();
        labelList.innerHTML = "";
        labels.forEach((label) => addLabelToSidebar(label));
      }

      function addLabelToSidebar(label) {
        const div = document.createElement("div");
        div.className = "label";
        div.textContent = label;
        div.setAttribute("draggable", "true");
        div.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/plain", label);
        });
        labelList.appendChild(div);
      }

      function removeLabelFromSidebar(text) {
        const labels = labelList.querySelectorAll(".label");
        labels.forEach((label) => {
          if (label.textContent === text) label.remove();
        });
      }

      function createDropZonesFromTemplate(template) {
        template.labels.forEach((labelData) => {
          const dropZone = document.createElement("div");
          dropZone.className = "dropzone";
          dropZone.style.left = `${labelData.x}px`;
          dropZone.style.top = `${labelData.y}px`;
          dropZone.dataset.correctLabel = labelData.text;

          dropZone.addEventListener("dragover", (e) => e.preventDefault());
          dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            const labelText = e.dataTransfer.getData("text/plain");
            if (labelText === dropZone.dataset.correctLabel) {
              const label = document.createElement("div");
              label.className = "label placed";
              label.textContent = labelText;
              label.style.position = "relative";
              dropZone.innerHTML = "";
              dropZone.appendChild(label);
              removeLabelFromSidebar(labelText);
            } else {
              dropZone.style.animation = "shake 0.3s";
              setTimeout(() => (dropZone.style.animation = ""), 300);
            }
          });

          canvasContainer.appendChild(dropZone);
        });
      }

      canvas.addEventListener("dragover", (e) => {
        e.preventDefault();
      });

      canvas.addEventListener("drop", (e) => {
        e.preventDefault();
        
        if (editMode) {
          const labelText = e.dataTransfer.getData("text/plain");

          // Get position relative to canvas
          const x = e.clientX - canvas.getBoundingClientRect().left;
          const y = e.clientY - canvas.getBoundingClientRect().top;

          // Create the placed label
          const div = document.createElement("div");
          div.className = "label placed";
          div.textContent = labelText;
          div.style.left = `${x}px`;
          div.style.top = `${y}px`;
          div.style.position = "absolute";

          // When clicked, return it to the sidebar
          div.addEventListener("click", () => {
            div.remove();
            addLabelToSidebar(labelText);
          });

          canvasContainer.appendChild(div);

          // Remove original label from sidebar
          removeLabelFromSidebar(labelText);
        }
      });

      document
        .getElementById("loadTemplate")
        .addEventListener("click", () => {
          document.getElementById("loadTemplateInput").click();
        });

      document
        .getElementById("loadTemplateView")
        .addEventListener("click", () => {
          document.getElementById("loadTemplateInputView").click();
        });

      function loadTemplate(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const template = JSON.parse(event.target.result);
            currentTemplate = template;

            if (!template.image || !Array.isArray(template.labels)) {
              alert("Invalid template format.");
              return;
            }

            img.onload = () => {
              imgLoaded = true;
              showAll = false;
              toggleRevealBtn.disabled = false;
              toggleRevealBtn.textContent = "Reveal Full Image";
              toggleRevealViewBtn.disabled = false;
              toggleRevealViewBtn.textContent = "Reveal Full Image";

              labelSidebar.classList.remove("show");
              canvasContainer.style.width = "100%";

              resizeCanvas();
              scaleImage();
              draw();

              // Load label names in sidebar, but don't render dropzones yet
              const labelNames = template.labels.map((l) => l.text);
              showLabelSidebar(labelNames);
            };

            img.src = template.image;
          } catch (err) {
            alert("Failed to parse template.");
          }
        };
        reader.readAsText(file);
      }

      loadTemplateInputView.addEventListener("change", (e) => {loadTemplate(e)});
      loadTemplateInput.addEventListener("change", (e) => {loadTemplate(e)});

      saveTemplateBtn.addEventListener("click", () => {
        if (!imgLoaded) {
          alert("Please upload an image first.");
          return;
        }

        // Get label data
        const labels = Array.from(document.querySelectorAll(".label.placed")).map(label => ({
          text: label.textContent,
          x: parseFloat(label.style.left),
          y: parseFloat(label.style.top)
        }));

        // Create base64 from image
        const offscreenCanvas = document.createElement("canvas");
        offscreenCanvas.width = img.width;
        offscreenCanvas.height = img.height;
        const offCtx = offscreenCanvas.getContext("2d");
        offCtx.drawImage(img, 0, 0);
        const imageData = offscreenCanvas.toDataURL("image/png");

        const template = {
          image: imageData,
          labels: labels
        };

        const blob = new Blob([JSON.stringify(template, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "template.json";
        a.click();

        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
