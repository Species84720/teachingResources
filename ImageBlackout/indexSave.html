<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Torch Blackout with Labels</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: sans-serif;
      overflow: hidden;
      color: white;
    }

    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    #canvasContainer {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      background: black;
    }

    #labelSidebar {
      width: 0;
      background: #222;
      transition: width 0.3s;
      overflow-y: auto;
      padding: 10px;
    }

    #labelSidebar.show {
      width: 20%;
    }

    #labelSidebar h3 {
      margin-top: 0;
    }

    .label {
      background: #444;
      margin: 5px;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: grab;
      color: white;
    }

    .label.placed {
  position: absolute;
  z-index: 5;
  pointer-events: auto;
  background: #fff;
  color: #000;
  padding: 4px 8px;
  border-radius: 5px;
  font-weight: bold;
  border: 1px solid #000;
}


    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }

    #controls input[type="file"],
    #controls button {
      font-size: 1rem;
      margin: 5px;
    }
  </style>
</head>
<body>

<div id="app">
  <div id="canvasContainer">
    <canvas id="canvas"></canvas>

    <div id="controls">
      <input type="file" id="imageInput" accept="image/*" />
      <button id="toggleReveal" disabled>Reveal Full Image</button>
      <input type="file" id="labelInput" accept=".json" />
      <button id="loadLabels">Load Labels</button>
<button id="saveTemplate">Save Template</button>
<input type="file" id="loadTemplateInput" accept=".json" hidden />
<button id="loadTemplate">Load Template</button>
    </div>
  </div>

  <div id="labelSidebar">
    <h3>Labels</h3>
    <div id="labelList"></div>
  </div>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const imageInput = document.getElementById("imageInput");
  const toggleRevealBtn = document.getElementById("toggleReveal");
  const labelInput = document.getElementById("labelInput");
  const loadLabelsBtn = document.getElementById("loadLabels");
  const labelSidebar = document.getElementById("labelSidebar");
  const labelList = document.getElementById("labelList");
  const canvasContainer = document.getElementById("canvasContainer");

  const torch = new Image();
  torch.src = "torch.png";
  let torchLoaded = false;
  torch.onload = () => torchLoaded = true;

  let img = new Image();
  let imgLoaded = false;

  let revealX = window.innerWidth / 2;
  let revealY = window.innerHeight / 2;
  let revealRadius = 100;
  let dragging = false;
  let showAll = false;

  let imgDrawWidth = 0;
  let imgDrawHeight = 0;
  let imgOffsetX = 0;
  let imgOffsetY = 0;

  const placedLabels = [];

  function resizeCanvas() {
    canvas.width = canvasContainer.clientWidth;
    canvas.height = canvasContainer.clientHeight;
    if (imgLoaded) {
      scaleImage();
      draw();
    }
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  imageInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function (event) {
        img.onload = () => {
          imgLoaded = true;
          showAll = false;
          toggleRevealBtn.disabled = false;
          scaleImage();
          draw();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  toggleRevealBtn.addEventListener("click", () => {
  showAll = !showAll;
  toggleRevealBtn.textContent = showAll ? "Hide Again" : "Reveal Full Image";

  // Toggle label visibility
  const labels = document.querySelectorAll(".label.placed");
  labels.forEach(label => {
    label.style.display = showAll ? "block" : "none";
  });

  // Toggle sidebar visibility
  if (showAll) {
    labelSidebar.classList.add("show");
    canvasContainer.style.width = "80%";
  } else {
    labelSidebar.classList.remove("show");
    canvasContainer.style.width = "100%";
  }

  resizeCanvas();
  draw();
});

  canvas.addEventListener("mousedown", (e) => {
  // Don't trigger dragging if clicking on a label
  if (e.target.classList.contains("label")) return;
  dragging = true;
  moveCircle(e);
});

  canvas.addEventListener("mousemove", (e) => {
    if (dragging) {
      moveCircle(e);
    }
  });

  canvas.addEventListener("mouseup", () => {
    dragging = false;
  });

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = Math.sign(e.deltaY);
    revealRadius -= delta * 10;
    revealRadius = Math.max(20, Math.min(revealRadius, canvas.height));
    draw();
  });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (e.touches.length === 1) {
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      revealX = touch.clientX - rect.left;
      revealY = touch.clientY - rect.top;
      draw();
    }
  }, { passive: false });

  function moveCircle(e) {
    const rect = canvas.getBoundingClientRect();
    revealX = e.clientX - rect.left;
    revealY = e.clientY - rect.top;
    draw();
  }

  function scaleImage() {
    imgDrawHeight = canvas.height;
    imgDrawWidth = (img.width / img.height) * canvas.height;
    imgOffsetX = (canvas.width - imgDrawWidth) / 2;
    imgOffsetY = 0;
  }

  function draw() {
    if (!imgLoaded) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, imgOffsetX, imgOffsetY, imgDrawWidth, imgDrawHeight);

    if (!showAll) {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.beginPath();
      ctx.arc(revealX, revealY, revealRadius, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, imgOffsetX, imgOffsetY, imgDrawWidth, imgDrawHeight);
      ctx.restore();

      if (torchLoaded) {
        const torchSize = revealRadius * 2;
        const torchOffsetX = -revealRadius * 0.8;
        const torchOffsetY = revealRadius * 0.6;
        ctx.drawImage(
          torch,
          revealX + torchOffsetX - torchSize / 2,
          revealY + torchOffsetY - torchSize / 2,
          torchSize,
          torchSize
        );
      }
    }
  }

  // LABEL LOADING
  loadLabelsBtn.addEventListener("click", () => {
    labelInput.click();
  });

  labelInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (Array.isArray(data.labels)) {
            showLabelSidebar(data.labels);
          } else {
            alert("JSON must contain an array of 'labels'");
          }
        } catch (err) {
          alert("Invalid JSON file.");
        }
      };
      reader.readAsText(file);
    }
  });

  function showLabelSidebar(labels) {
    labelSidebar.classList.add("show");
    canvasContainer.style.width = "80%";
    resizeCanvas();
    labelList.innerHTML = "";

    labels.forEach(label => {
      const div = document.createElement("div");
      div.className = "label";
      div.textContent = label;
      div.setAttribute("draggable", "true");

      div.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", label);
      });

      labelList.appendChild(div);
    });
  }

  canvas.addEventListener("dragover", (e) => {
    e.preventDefault();
  });

  canvas.addEventListener("drop", (e) => {
  e.preventDefault();
if (!showAll) div.style.display = "none";
  const labelText = e.dataTransfer.getData("text/plain");

  // Get position relative to canvas
  const x = e.clientX - canvas.getBoundingClientRect().left;
  const y = e.clientY - canvas.getBoundingClientRect().top;

  // Create the placed label
  const div = document.createElement("div");
  div.className = "label placed";
  div.textContent = labelText;
  div.style.left = `${x}px`;
  div.style.top = `${y}px`;
  div.style.position = "absolute";

  // When clicked, return it to the sidebar
  div.addEventListener("click", () => {
    div.remove();
    addLabelToSidebar(labelText);
  });

  canvasContainer.appendChild(div);

  // Remove original label from sidebar
  removeLabelFromSidebar(labelText);
});

function removeLabelFromSidebar(text) {
  const labels = labelList.querySelectorAll(".label");
  labels.forEach(label => {
    if (label.textContent === text) {
      label.remove();
    }
  });
}

function addLabelToSidebar(text) {
  const div = document.createElement("div");
  div.className = "label";
  div.textContent = text;
  div.setAttribute("draggable", "true");

  div.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/plain", text);
  });

  labelList.appendChild(div);
}

const saveTemplateBtn = document.getElementById("saveTemplate");
const loadTemplateBtn = document.getElementById("loadTemplate");
const loadTemplateInput = document.getElementById("loadTemplateInput");

saveTemplateBtn.addEventListener("click", () => {
  if (!imgLoaded) {
    alert("Please upload an image first.");
    return;
  }

  // Get label data
  const labels = Array.from(document.querySelectorAll(".label.placed")).map(label => ({
    text: label.textContent,
    x: parseFloat(label.style.left),
    y: parseFloat(label.style.top)
  }));

  // Create base64 from image
  const offscreenCanvas = document.createElement("canvas");
  offscreenCanvas.width = img.width;
  offscreenCanvas.height = img.height;
  const offCtx = offscreenCanvas.getContext("2d");
  offCtx.drawImage(img, 0, 0);
  const imageData = offscreenCanvas.toDataURL("image/png");

  const template = {
    image: imageData,
    labels: labels
  };

  const blob = new Blob([JSON.stringify(template, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "template.json";
  a.click();

  URL.revokeObjectURL(url);
});

loadTemplateBtn.addEventListener("click", () => {
  loadTemplateInput.click();
});

loadTemplateInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const template = JSON.parse(event.target.result);
      if (!template.image || !Array.isArray(template.labels)) {
        alert("Invalid template format.");
        return;
      }

      // Load image
      img.onload = () => {
        imgLoaded = true;
        showAll = true;
        toggleRevealBtn.disabled = false;
        toggleRevealBtn.textContent = "Hide Again";

        // Adjust layout
        labelSidebar.classList.add("show");
        canvasContainer.style.width = "80%";

        resizeCanvas();
        scaleImage();
        draw();

        // Clear existing labels
        document.querySelectorAll(".label.placed").forEach(el => el.remove());

        // Load labels
        template.labels.forEach(labelData => {
          const div = document.createElement("div");
          div.className = "label placed";
          div.textContent = labelData.text;
          div.style.left = `${labelData.x}px`;
          div.style.top = `${labelData.y}px`;

          div.addEventListener("click", () => {
            div.remove();
            addLabelToSidebar(labelData.text);
          });

          canvasContainer.appendChild(div);
        });
      };

      img.src = template.image;

    } catch (err) {
      alert("Failed to parse template.");
    }
  };
  reader.readAsText(file);
});
</script>

</body>
</html>
